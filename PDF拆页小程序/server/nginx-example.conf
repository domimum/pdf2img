# Nginx 反向代理示例：把 HTTPS 域名请求转发到本地 3000 端口的渲染服务
# 放在 /etc/nginx/conf.d/pdf-render.conf（或你的站点配置里），改 server_name 为你的域名

server {
    listen 443 ssl http2;
    server_name pdf.你的域名.com;   # ← 改成你的域名

    # SSL 证书路径（用你已有的证书，或腾讯云/阿里云免费证书）
    ssl_certificate     /etc/nginx/ssl/你的域名.pem;
    ssl_certificate_key /etc/nginx/ssl/你的域名.key;

    # 渲染 PDF 可能返回几 MB 的 base64，调大请求体限制
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;   # 渲染较慢，超时放宽到 120 秒
    }
}

# HTTP 自动跳 HTTPS
server {
    listen 80;
    server_name pdf.你的域名.com;
    return 301 https://$host$request_uri;
}
